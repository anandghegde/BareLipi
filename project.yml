name: BareLipi
options:
  bundleIdPrefix: com.barelipi
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  BareLipiPackage:
    path: .
targets:
  BareLipiApp:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      # The app layer (LipiDocument, AtomicWriter, windows, menu) lives in
      # the SwiftPM package so `swift test` covers it; App/ is the entry point.
      - package: BareLipiPackage
        product: LipiApp
    info:
      path: App/Info.plist
      properties:
        CFBundleName: BareLipi
        CFBundleDisplayName: BareLipi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [net.daringfireball.markdown, public.plain-text]
            # @objc(LipiDocument) in Sources/LipiApp/LipiDocument.swift.
            NSDocumentClass: LipiDocument
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: BareLipi
        PRODUCT_BUNDLE_IDENTIFIER: com.barelipi.app
        MACOSX_DEPLOYMENT_TARGET: "15.0"
    entitlements:
      path: App/BareLipi.entitlements
      properties: {}
